# A hand-made PersonaMem-shaped fixture: multi-session persona turns + multiple-choice probes.
# Small enough to run offline on the fakes (tests) and as a smoke slice (/bench).
# Shapes mirror the real benchmark: a stable preference, a stable fact, an evolving preference,
# and an unanswerable probe (abstention - which MC scoring penalises; we report it separately).
#
# Every probe is answered AGAINST THE WHOLE INGESTED MIND (spec §49): ingest all sessions, let the
# deep brain groom, then probe. This matches the real PersonaMem loader, which positions every
# question at the last session. So a "stable" preference must genuinely never be superseded, and an
# "evolving" one resolves to its LATEST value - the fixture is written to be coherent read that way.
name = "personamem-sample"

[[session]]
turns = [
    "Green tea is my favourite drink.",
    "Chess is my main hobby these days.",
]

[[session]]
turns = [
    "Window seats are what I always book to fly.",
    "Chess tournaments fill my weekends now.",
]

[[session]]
turns = [
    "Matcha lattes are my new go-to drink.",
]

[[probe]]
# a STABLE preference - stated once, never contradicted, so it survives the whole ingest
type = "recall_preference"
question = "Which seat should you book for me?"
options = ["aisle", "window", "middle"]
answer = "window"

[[probe]]
type = "recall_fact"
question = "Which hobby fills my weekends?"
options = ["chess", "painting", "running"]
answer = "chess"

[[probe]]
# an EVOLVING preference: green tea -> matcha; the current go-to is what should win
type = "preference_evolution"
question = "Which drink is my current go-to?"
options = ["green tea", "matcha lattes", "cola"]
answer = "matcha lattes"

[[probe]]
type = "unanswerable"
question = "Which breed of dog do I own?"
options = ["beagle", "poodle", "husky"]
answer = "beagle"
